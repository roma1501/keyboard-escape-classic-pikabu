<head>

    <link rel="icon" type="image/webp" href="assets/ui/icons/candy.webp">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        @font-face { font-family: 'Nunito'; src: url('assets/fonts/nunito.ttf?v=1.0.6-5e9a45f6') format('truetype'); font-weight: 200 1000; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Fredoka'; src: url('assets/fonts/fredoka.ttf?v=1.0.6-5e9a45f6') format('truetype'); font-weight: 300 700; font-style: normal; font-display: swap; }
        *, *::before, *::after { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        input[type="text"], input[type="number"], input[type="search"], textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; }
        ::selection { background: transparent; }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        /* Экран загрузки «Keyboard Escape Classic»: глазурь, шоколадные подтёки, посыпка, клавиши-логотип нажимаются по очереди,
           полоса — плитка шоколада, которая заливается розовой глазурью. DOM-контракт LoadingScreen сохранён. */
        #loading-screen {
            position: fixed; inset: 0; z-index: 1000; overflow: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: clamp(10px, 2.4vh, 20px);
            background: radial-gradient(ellipse at 50% 38%, #ffe3f1 0%, #ffb3d6 46%, #f27bb3 100%);
            font-family: 'Nunito', system-ui, sans-serif; color: #4a2414;
        }
        #loading-screen::before {   /* шоколадные подтёки сверху */
            content: ''; position: absolute; left: -5%; right: -5%; top: 0; height: clamp(60px, 13vh, 120px); pointer-events: none;
            background:
                radial-gradient(circle at 8% 100%, #5a301a 0 26px, transparent 27px),
                radial-gradient(circle at 23% 100%, #5a301a 0 18px, transparent 19px),
                radial-gradient(circle at 41% 100%, #5a301a 0 32px, transparent 33px),
                radial-gradient(circle at 63% 100%, #5a301a 0 20px, transparent 21px),
                radial-gradient(circle at 79% 100%, #5a301a 0 28px, transparent 29px),
                radial-gradient(circle at 94% 100%, #5a301a 0 16px, transparent 17px),
                linear-gradient(#4a2414, #6b3a1e 70%, transparent 71%);
            filter: drop-shadow(0 6px 0 rgba(74,36,20,.25));
        }
        #loading-screen::after {    /* посыпка падает */
            content: ''; position: absolute; inset: -40% 0 0 0; pointer-events: none; opacity: .85;
            background-image:
                radial-gradient(ellipse 3px 8px at 12% 20%, #7ef0c8 98%, transparent), radial-gradient(ellipse 3px 8px at 31% 64%, #fbe86a 98%, transparent),
                radial-gradient(ellipse 3px 8px at 52% 12%, #5ab8ff 98%, transparent), radial-gradient(ellipse 3px 8px at 70% 48%, #ffffff 98%, transparent),
                radial-gradient(ellipse 3px 8px at 86% 30%, #a77bff 98%, transparent), radial-gradient(ellipse 3px 8px at 6% 80%, #ff6b6b 98%, transparent),
                radial-gradient(ellipse 3px 8px at 44% 88%, #7ef0c8 98%, transparent), radial-gradient(ellipse 3px 8px at 93% 76%, #fbe86a 98%, transparent);
            background-size: 340px 340px; animation: ke-sprinkle 9s linear infinite;
        }
        @keyframes ke-sprinkle { to { transform: translateY(40%); } }
        .ke-load-logo { visibility: hidden; position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: clamp(4px, 1vh, 10px); }
        .ke-load-row { display: flex; gap: clamp(2px, 0.7vw, 8px); max-width: 94vw; }
        .ke-load-row b {
            display: grid; place-items: center; width: clamp(18px, 6.2vw, 64px); height: clamp(20px, 6.6vw, 66px);
            font: 900 clamp(12px, 4vw, 40px)/1 'Nunito', system-ui, sans-serif; color: #fff; border-radius: 22%;
            background: linear-gradient(#ff8fc8, #ff5fa8); box-shadow: 0 clamp(4px, 1vw, 8px) 0 #b23a74, 0 clamp(6px, 1.4vw, 12px) 10px rgba(74,36,20,.35);
            text-shadow: 0 2px 0 rgba(122,31,79,.6); animation: ke-key 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * 0.11s);
        }
        .ke-load-row.r2 b { background: linear-gradient(#a0623a, #6b3a1e); box-shadow: 0 clamp(4px, 1vw, 8px) 0 #3a1e0e, 0 clamp(6px, 1.4vw, 12px) 10px rgba(74,36,20,.35); text-shadow: 0 2px 0 #2a160c; }
        @keyframes ke-key { 0%, 70%, 100% { transform: translateY(0); } 78% { transform: translateY(clamp(3px, 0.8vw, 7px)); box-shadow: 0 1px 0 #7a1f4f; filter: brightness(1.25); } }
        #loading-title {
            position: relative; z-index: 1; margin: 0; font: 900 clamp(15px, 2.6vw, 24px)/1.1 'Nunito', system-ui, sans-serif; letter-spacing: .28em;
            color: #fff; -webkit-text-stroke: 4px #4a2414; paint-order: stroke fill; text-align: center; max-width: 86vw; text-transform: uppercase;
        }
        .loading-bar {
            position: relative; z-index: 1; width: min(420px, 78vw); height: clamp(22px, 3.6vh, 30px); border-radius: 12px; overflow: hidden;
            background: repeating-linear-gradient(90deg, #5a301a 0 calc(12.5% - 3px), #3a1e0e calc(12.5% - 3px) 12.5%);
            box-shadow: inset 0 3px 0 rgba(255,255,255,.18), inset 0 -4px 0 rgba(0,0,0,.25), 0 5px 0 #2a160c;
        }
        .loading-progress {
            height: 100%; width: 0%; transition: width .3s ease; border-radius: 0 10px 10px 0;
            background: linear-gradient(#ffb8e0, #ff5fa8 60%, #e0408c); box-shadow: inset 0 3px 0 rgba(255,255,255,.55);
        }
        #loading-percent { position: relative; z-index: 1; font: 900 clamp(15px, 2.4vw, 20px) 'Nunito', system-ui, sans-serif; color: #fff; -webkit-text-stroke: 3px #b23a74; paint-order: stroke fill; }
        .loading-text { position: relative; z-index: 1; font: 800 clamp(12px, 1.9vw, 16px) 'Nunito', system-ui, sans-serif; color: #7a1f4f; text-align: center; min-height: 1em; }
        #loading-retry { position: relative; z-index: 1; padding: 12px 28px; border: 0; border-radius: 14px; background: linear-gradient(#7ef0c8, #2fa884); color: #0f3d30; font: 900 17px 'Nunito', system-ui, sans-serif; cursor: pointer; box-shadow: 0 5px 0 #1f6a52; }
        @media (max-height: 420px) { .ke-load-row b { width: clamp(24px, 5.2vw, 44px); height: clamp(26px, 5.4vw, 46px); font-size: clamp(14px, 3.2vw, 28px); } }
    </style>
</head>

    <script>
        // Клавиши-логотип загрузки — на языке игры (ПОБЕГ / С КЛАВИАТУРЫ · KEYBOARD / ESCAPE); до этого скрыты, без мигания
        (() => {
            const paint = () => {
                const box = document.querySelector('.ke-load-logo');
                if (!box || typeof Lang === 'undefined') return;
                let i = 0;
                const row = (cls, text) => '<div class="ke-load-row ' + cls + '">' + Array.from(String(text)).map(ch => ch === ' ' ? '<i style="width:.6em"></i>' : '<b style="--i:' + (i++) + '">' + ch + '</b>').join('') + '</div>';
                box.innerHTML = row('r1', Lang.t('ke.logo1')) + row('r2', Lang.t('ke.logo2'));
                const t = document.getElementById('loading-title'); if (t) t.textContent = Lang.t('ke.logo.sub');
                box.style.visibility = 'visible';
            };
            try { Lang.init(null); } catch (e) { /* язык уточнит main.js */ }
            paint();
            /** @type {any} */ (window).keLoadPaint = paint;   // main.js уточняет язык площадки — Game.init перерисует
            window.addEventListener('lory-language', paint);
        })();
    </script>

    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        // Ловим в фазе захвата на window: элемент интерфейса со stopPropagation защиту не обходит. Полем считается только
        // текстовое (ползунок, кнопка, флажок — нет); меню «Копировать / Выделить всё» не открывается и на них.
        (() => {
            const isField = t => !!t && (t.tagName === 'TEXTAREA' || t.isContentEditable ||
                (t.tagName === 'INPUT' && /^(text|number|search|email|password|tel|url)$/i.test(t.type || 'text')));
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                window.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); }, { capture: true, passive: false });
            }
            // Ctrl/Cmd+A вне текстового поля ничего не выделяет; случайное выделение (двойной клик, долгий тап) сразу снимается
            window.addEventListener('keydown', e => {
                if ((e.ctrlKey || e.metaKey) && (e.code === 'KeyA' || e.key === 'a' || e.key === 'A') && !isField(e.target)) e.preventDefault();
            }, { capture: true });
            document.addEventListener('selectionchange', () => {
                const sel = window.getSelection && window.getSelection();
                if (sel && sel.rangeCount && !isField(document.activeElement)) sel.removeAllRanges();
            });
        })();
    </script>
